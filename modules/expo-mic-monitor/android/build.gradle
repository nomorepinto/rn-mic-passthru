apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'expo.modules.micmonitor'
version = '1.0.0'

buildscript {
  def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
  if (expoModulesCorePlugin.exists()) {
    apply from: expoModulesCorePlugin
    applyKotlinExpoModulesCorePlugin()
  }

  // Fallback — allows building even when the plugin script is missing
  // (e.g. during dependency resolution before prebuild wires everything up).
  repositories {
    mavenCentral()
    google()
  }
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "expo.modules.micmonitor"

  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)

    // ── NDK / CMake flags ──────────────────────────────────────────────
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17 -fexceptions -frtti -O2"
        // Build only ABIs that Expo / React Native actually ship.
        // arm64-v8a  = physical device (most phones since ~2017)
        // x86_64     = emulator on Intel/AMD host (for dev builds)
        abiFilters "arm64-v8a", "x86_64"
      }
    }
  }

  // ── Prefab: lets CMake consume the Oboe AAR via find_package() ─────
  buildFeatures {
    prefab true
  }

  // ── Point Gradle at our CMakeLists.txt ─────────────────────────────
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${safeExtGet('kotlinVersion', '1.9.24')}"

  // Google Oboe — low-latency audio I/O on Android.
  // The AAR ships pre-built .so files exposed via Prefab so CMake can
  // link against them with `find_package(oboe REQUIRED CONFIG)`.
  implementation 'com.google.oboe:oboe:1.9.3'
}
